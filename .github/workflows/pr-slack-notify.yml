name: Post PR to Slack

on:
  workflow_call:
    inputs:
      channel_id:
        description: 'Slack channel ID to post to'
        required: true
        type: string
      review_group:
        description: 'Slack user group ID to tag (e.g. @pr-infra)'
        required: true
        type: string
      pr_number:
        description: 'PR number (for manual trigger only)'
        required: false
        type: string
      pr_title:
        description: 'PR title (for manual trigger only)'
        required: false
        type: string
      pr_url:
        description: 'PR URL (for manual trigger only)'
        required: false
        type: string
      pr_author:
        description: 'PR author (for manual trigger only)'
        required: false
        type: string
    secrets:
      SLACK_BOT_TOKEN:
        description: 'Slack bot token'
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v5
        with:
          repository: e2b-dev/.github
          sparse-checkout: .github/actions/pr-slack-notify

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: npm ci
        working-directory: .github/actions/pr-slack-notify

      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.channel_id }}
          SLACK_REVIEW_GROUP: ${{ inputs.review_group }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
          PR_AUTHOR: ${{ inputs.pr_author }}
        run: node .github/actions/pr-slack-notify/script.js
